[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Dual-licensed: MIT OR Apache-2.0, see LICENSE-MIT and LICENSE-APACHE.
license = "MIT OR Apache-2.0"
repository = "https://github.com/aamsur/file-dermaga"
rust-version = "1.85"

[workspace.dependencies]
file-dermaga-core = { path = "crates/file-dermaga-core" }
file-dermaga-ftp = { path = "crates/file-dermaga-ftp" }
file-dermaga-s3 = { path = "crates/file-dermaga-s3" }
file-dermaga-transfer = { path = "crates/file-dermaga-transfer" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.100"
clap = { version = "4.5", features = ["derive", "env"] }
url = "2.5"

# Keep debug builds small: line tables for our code, no debug info for deps.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
