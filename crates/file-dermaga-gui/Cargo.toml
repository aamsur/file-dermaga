[package]
name = "file-dermaga-gui"
description = "Desktop FTP/FTPS/SFTP/WebDAV/S3 client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "file-dermaga-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
file-dermaga-core.workspace = true
file-dermaga-ftp.workspace = true
file-dermaga-s3.workspace = true
file-dermaga-sftp.workspace = true
file-dermaga-webdav.workspace = true
file-dermaga-transfer.workspace = true
anyhow.workspace = true
tokio.workspace = true
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Saved passwords / secret keys live in the OS keyring (Secret Service on Linux).
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }

[features]
# Production build: serve the embedded UI through Tauri's custom protocol.
custom-protocol = ["tauri/custom-protocol"]

# Debian package (built by `cargo deb`, see .github/workflows/release.yml).
# Contains both the desktop app and the `file-dermaga` command line tool.
[package.metadata.deb]
name = "file-dermaga"
maintainer = "Aam Surganda <surganda@gmail.com>"
copyright = "2026, The FileDermaga Authors"
section = "net"
priority = "optional"
depends = "$auto"
recommends = "gnome-keyring"
extended-description = """\
FileDermaga is a desktop and command line client for FTP, FTPS (explicit and \
implicit TLS) and Amazon S3 compatible object storage (AWS, Backblaze B2, \
Cloudflare R2, Wasabi, MinIO and others). It offers a two-pane file manager, \
a transfer queue, a site manager with connection testing, and keeps saved \
passwords in the system keyring."""
assets = [
    ["target/release/file-dermaga-gui", "usr/bin/", "755"],
    ["target/release/file-dermaga", "usr/bin/", "755"],
    ["../../packaging/linux/file-dermaga.desktop", "usr/share/applications/", "644"],
    ["icons/icon.png", "usr/share/icons/hicolor/256x256/apps/file-dermaga.png", "644"],
    ["../../README.md", "usr/share/doc/file-dermaga/", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/file-dermaga/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/file-dermaga/", "644"],
    # generated by `cargo about` (packaging/about.toml) before `cargo deb`
    ["target/release/THIRD-PARTY-LICENSES.html", "usr/share/doc/file-dermaga/", "644"],
]
