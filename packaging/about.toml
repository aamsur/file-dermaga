# cargo-about configuration: generates the third-party license notices that
# ship inside the .deb (see .github/workflows/release.yml).
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
workarounds = ["ring", "rustls"]
